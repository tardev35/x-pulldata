<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>x-pulldata · สแครป X การตลาด iGaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#eef1f6; --panel:#fff; --panel-2:#f6f8fb; --line:#d3d9e4;
  --ink:#171c26; --dim:#5d6879; --faint:#8c96a8;
  --amber:#b4741a; --amber-soft:#f3e4cc;
  --teal:#0f7a6c; --teal-soft:#d6ece8;
  --alert:#b03a2b; --alert-soft:#f7dfda;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0f131b; --panel:#171d28; --panel-2:#1d2431; --line:#2b3444;
  --ink:#e8ecf3; --dim:#98a3b6; --faint:#6b7689;
  --amber:#e0a458; --amber-soft:#3a2c17;
  --teal:#59bfb0; --teal-soft:#12302d;
  --alert:#e06c56; --alert-soft:#3a1d18;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.6}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}

.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}

/* ---- เมนูข้าง ---- */
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 0;
  position:sticky;top:0;height:100vh;overflow:auto}
@media(max-width:900px){aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;display:block}
.brand span{font-size:11.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace}
.navhead{padding:14px 18px 5px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 18px;color:var(--dim);cursor:pointer;border-left:2px solid transparent;font-size:14px}
nav a:hover{background:var(--panel-2);color:var(--ink)}
nav a.on{background:var(--amber-soft);color:var(--amber);border-left-color:var(--amber);font-weight:600}
nav a .c{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint)}
nav a.on .c{color:var(--amber)}

.kwlist{max-height:230px;overflow:auto;padding:2px 10px 6px}
.kw{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
  padding:5px 9px;border:1px solid transparent;border-radius:7px;background:none;
  color:var(--dim);font-size:12.5px;cursor:pointer;font-family:inherit;text-align:left}
.kw:hover{color:var(--ink);background:var(--panel-2)}
.kw.on{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);font-weight:600}
.kw .c{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
.kw.on .c{color:var(--amber)}

.runbox{margin:8px 14px;padding:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px}
.runbox input{width:100%;font:inherit;font-size:13px;padding:7px 10px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.runbox button{width:100%;font:inherit;font-size:13.5px;cursor:pointer;padding:8px;border-radius:7px;
  background:var(--amber);border:1px solid var(--amber);color:var(--ground);font-weight:600}
.runbox button:disabled{opacity:.5;cursor:default}
.runlog{margin-top:9px;max-height:130px;overflow:auto;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;color:var(--dim);white-space:pre-wrap;line-height:1.45}

/* ---- เนื้อหา ---- */
main{padding:22px 26px 60px;min-width:0}
h1{font-size:21px;font-weight:700;margin:0 0 3px}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 16px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input[type=text].search{font:inherit;font-size:13.5px;padding:7px 12px;border-radius:7px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:230px}
input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:7px}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--teal);margin-left:auto;
  font-family:"IBM Plex Mono",monospace}
.live i{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:blip 1.4s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}
.live.off{color:var(--faint)} .live.off i{background:var(--faint);animation:none}
.count{font-size:12.5px;color:var(--dim);font-family:"IBM Plex Mono",monospace}

/* ---- ตาราง (คอลัมน์ตาม Google Sheet เดิม) ---- */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:76vh}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--panel-2);color:var(--dim);
  font-weight:600;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--panel-2)}
tbody tr.new{animation:in .5s ease-out}
@keyframes in{from{background:var(--amber-soft)}to{background:transparent}}
.c-num{color:var(--faint);font-family:"IBM Plex Mono",monospace;text-align:right;width:44px}
.c-text{max-width:360px;min-width:260px;white-space:pre-wrap;font-size:12.5px;color:var(--ink)}
.c-text .kw{display:inline;padding:0;background:none;border:0;color:var(--teal);font-size:11px}
.brandcell{font-weight:600;white-space:nowrap}
.brandcell.no{color:var(--faint);font-weight:400}
.u{font-family:"IBM Plex Mono",monospace;font-size:11px;max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;display:block}
.c-date{white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim)}
.c-line{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--amber);white-space:nowrap}
.prev img{height:56px;max-width:110px;border-radius:5px;object-fit:cover;display:block;border:1px solid var(--line)}
.vd{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;padding:2px 9px;
  border-radius:20px;background:var(--alert-soft);color:var(--alert)}
.promo{font-size:11px;color:var(--amber);margin-top:3px}
.empty{padding:50px;text-align:center;color:var(--faint)}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--dim);font-family:"IBM Plex Mono",monospace}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>x-pulldata</b><span id="hostinfo">สแครป X → สกัด AI → โดเมนจริง</span></div>

    <div class="navhead">มุมมอง</div>
    <nav id="tabs"></nav>

    <div class="navhead">คีย์เวิร์ด <span id="kwstat" class="mono" style="color:var(--faint)"></span></div>
    <div class="kwlist" id="kwlist"></div>

    <div class="navhead">ดึงข้อมูลตอนนี้</div>
    <div class="runbox">
      <input type="text" id="runterm" placeholder="พิมพ์คีย์เวิร์ด (เว้นว่าง=ทุกคำ)">
      <button id="runbtn">▶ ดึงจาก X</button>
      <div class="runlog mono" id="runlog"></div>
    </div>
  </aside>

  <main>
    <h1>ผลสแครปการตลาด iGaming จาก X</h1>
    <p class="sub" id="statline">กำลังโหลด…</p>
    <div class="bar">
      <input type="text" class="search" id="q" placeholder="ค้นในแคปชั่น / แบรนด์ / โดเมน…">
      <button class="btn" id="refresh">รีเฟรช</button>
      <span class="count" id="count"></span>
      <span class="live off" id="live"><i></i><span id="livetxt">—</span></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th class="c-num">#</th><th>TEXT</th><th>ชื่อแบรนด์</th>
          <th>URL Landing</th><th>URL On post</th><th>URL Landing 2</th>
          <th>Line@</th><th>DATE</th><th>POST X</th><th>Preview</th><th>VDO</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
var ALL=[], KW=[], STATUS={}, seen={}, first=true;
var tab="all", kwFilter="", q="";
var TABS=[
  {k:"all",   t:"ทั้งหมด"},
  {k:"gam",   t:"เว็บพนัน"},
  {k:"notgam",t:"ไม่ใช่พนัน"},
  {k:"video", t:"มีวิดีโอ"},
  {k:"wait",  t:"รอหาโดเมน"},
];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function host(u){try{return new URL(u).host.replace(/^www\./,"");}catch(e){return u||"";}}
function short(u){var h=host(u);return h?h:(u||"");}
function fdate(s){if(!s)return"";var d=new Date(s);if(isNaN(d))return String(s).slice(0,16);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function isGam(r){return r.is_gambling==1||r.is_gambling===true;}

function pass(r){
  if(tab==="gam"&&!isGam(r))return false;
  if(tab==="notgam"&&isGam(r))return false;
  if(tab==="video"&&!r.video_url)return false;
  if(tab==="wait"&&(r.final_url||!isGam(r)))return false;
  if(kwFilter&&r.search_term!==kwFilter)return false;
  if(q){
    var hay=((r.text||"")+" "+(r.brand_name||"")+" "+(r.final_brand||"")+" "+
      (r.final_url||"")+" "+(r.url_landing||"")+" "+(r.author||"")).toLowerCase();
    if(hay.indexOf(q.toLowerCase())<0)return false;
  }
  return true;
}

function drawTabs(){
  var n=document.getElementById("tabs");n.innerHTML="";
  TABS.forEach(function(o){
    var c=ALL.filter(function(r){var s=tab;tab=o.k;var ok=passTab(r);tab=s;return ok;}).length;
    var a=document.createElement("a");a.className=(tab===o.k?"on":"");
    a.innerHTML="<span>"+o.t+"</span><span class='c'>"+c+"</span>";
    a.onclick=function(){tab=o.k;kwFilter="";draw();};
    n.appendChild(a);
  });
}
// นับตามแท็บอย่างเดียว (ไม่รวม q/kwFilter) เพื่อให้ตัวเลขข้างแท็บนิ่ง
function passTab(r){
  if(tab==="gam")return isGam(r);
  if(tab==="notgam")return !isGam(r);
  if(tab==="video")return !!r.video_url;
  if(tab==="wait")return isGam(r)&&!r.final_url;
  return true;
}

function drawKw(){
  var box=document.getElementById("kwlist");box.innerHTML="";
  var cnt={};ALL.forEach(function(r){if(r.search_term)cnt[r.search_term]=(cnt[r.search_term]||0)+1;});
  var terms=KW.slice().sort(function(a,b){return (cnt[b.term]||0)-(cnt[a.term]||0)||b.hits-a.hits;});
  var all=document.createElement("button");all.className="kw"+(kwFilter===""?" on":"");
  all.innerHTML="<span>— ทุกคีย์เวิร์ด —</span><span class='c'>"+ALL.length+"</span>";
  all.onclick=function(){kwFilter="";draw();};box.appendChild(all);
  terms.forEach(function(k){
    var b=document.createElement("button");b.className="kw"+(kwFilter===k.term?" on":"");
    b.innerHTML="<span>"+esc(k.term)+(k.source==="ai"?" ✦":"")+"</span><span class='c'>"+(cnt[k.term]||0)+"</span>";
    b.title=(k.source==="ai"?"คีย์เวิร์ดที่ AI สกัดได้อัตโนมัติ":"คีย์เวิร์ดตั้งต้น")+" · hits "+k.hits;
    b.onclick=function(){kwFilter=(kwFilter===k.term?"":k.term);draw();};
    box.appendChild(b);
  });
  document.getElementById("kwstat").textContent=KW.length+" คำ";
}

function ulink(u){if(!u)return"<span style='color:var(--faint)'>—</span>";
  return "<a class='u' href='"+esc(u)+"' target='_blank' title='"+esc(u)+"'>"+esc(short(u))+"</a>";}

function draw(){
  drawTabs();drawKw();
  var rows=ALL.filter(pass);
  document.getElementById("count").textContent=rows.length+" / "+ALL.length+" โพสต์";
  var tb=document.getElementById("tb");
  if(!rows.length){tb.innerHTML="<tr><td colspan='11' class='empty'>ยังไม่มีข้อมูล — กด ▶ ดึงจาก X ทางซ้าย</td></tr>";return;}
  var html="";
  rows.forEach(function(r,i){
    var brand=r.final_brand||r.brand_name||"";
    var bcls="brandcell"+(!isGam(r)?" no":"");
    var kwtags=(r.keywords||[]).slice(0,4).map(function(k){return "<span class='pill'>"+esc(k)+"</span>";}).join("");
    var promo=(r.promotions||[]).slice(0,2).join(" · ");
    var isnew=first?false:!seen[r.tweet_id];
    html+="<tr class='"+(isnew?"new":"")+"'>"+
      "<td class='c-num'>"+(i+1)+"</td>"+
      "<td class='c-text'>"+esc((r.text||"").slice(0,320))+
        (promo?"<div class='promo'>🎁 "+esc(promo)+"</div>":"")+
        (kwtags?"<div class='pills'>"+kwtags+"</div>":"")+"</td>"+
      "<td class='"+bcls+"'>"+esc(brand||"—")+"</td>"+
      "<td>"+ulink(r.url_landing)+"</td>"+
      "<td>"+ulink(r.final_url)+"</td>"+
      "<td>"+ulink(r.url_landing_2)+"</td>"+
      "<td class='c-line'>"+esc(r.line_id||"")+"</td>"+
      "<td class='c-date'>"+esc(fdate(r.created_at))+"</td>"+
      "<td>"+(r.tweet_url?"<a class='u' href='"+esc(r.tweet_url)+"' target='_blank'>โพสต์ ↗</a>":"—")+"</td>"+
      "<td class='prev'>"+(r.preview_img?"<a href='"+esc(r.preview_img)+"' target='_blank'><img loading='lazy' src='"+esc(r.preview_img)+"'></a>":"")+"</td>"+
      "<td>"+(r.video_url?"<a class='vd' href='"+esc(r.video_url)+"' target='_blank'>▶ VDO</a>":"")+"</td>"+
    "</tr>";
  });
  tb.innerHTML=html;
  ALL.forEach(function(r){seen[r.tweet_id]=1;});
  first=false;
}

function loadPosts(){
  fetch("/api/posts").then(function(r){return r.json();}).then(function(d){
    ALL=d.rows||[];draw();
  }).catch(function(){});
}
function loadSide(){
  fetch("/api/keywords").then(function(r){return r.json();}).then(function(d){KW=d.rows||[];drawKw();});
  fetch("/api/stats").then(function(r){return r.json();}).then(function(s){
    document.getElementById("statline").textContent=
      "ทั้งหมด "+s.total+" โพสต์ · เว็บพนัน "+s.gambling+" · แบรนด์ "+s.brands+" · คีย์เวิร์ด "+s.keywords+" คำ"+
      (s.last_ingest?" · ล่าสุด "+new Date(s.last_ingest*1000).toLocaleString("th-TH"):"");
  });
  fetch("/api/status").then(function(r){return r.json();}).then(function(s){
    STATUS=s;
    document.getElementById("hostinfo").textContent="model: "+(s.model||"?")+(s.collector?" · auto":"");
  });
}
function pollRun(){
  fetch("/api/run-status").then(function(r){return r.json();}).then(function(s){
    var live=document.getElementById("live"),txt=document.getElementById("livetxt");
    var btn=document.getElementById("runbtn");
    if(s.busy){live.className="live";txt.textContent="กำลังดึง: "+(s.term||"");btn.disabled=true;btn.textContent="⏳ กำลังดึง…";}
    else{live.className="live off";txt.textContent="ว่าง";btn.disabled=false;btn.textContent="▶ ดึงจาก X";}
    document.getElementById("runlog").textContent=(s.log||[]).slice(-40).join("\n");
    var rl=document.getElementById("runlog");rl.scrollTop=rl.scrollHeight;
  }).catch(function(){});
}

document.getElementById("q").oninput=function(){q=this.value;draw();};
document.getElementById("refresh").onclick=function(){loadPosts();loadSide();};
document.getElementById("runbtn").onclick=function(){
  var t=document.getElementById("runterm").value.trim();
  fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({term:t})}).then(function(r){return r.json();}).then(function(){pollRun();});
};
document.getElementById("runterm").onkeydown=function(e){if(e.key==="Enter")document.getElementById("runbtn").click();};

loadPosts();loadSide();pollRun();
setInterval(loadPosts,6000);
setInterval(loadSide,15000);
setInterval(pollRun,2000);
</script>
</body>
</html>
